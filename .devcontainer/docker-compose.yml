# Dev container services. The images (tag and digest) must equal the ones in dev_tools/services.py
# (tests/test_services.py checks it). The credentials are throwaways for local
# instances that hold no data. `app` and `s3` share the `db` network namespace, so
# PostgreSQL is on 127.0.0.1:5432, MinIO on 127.0.0.1:9000, and the fixtures'
# local-host guards hold.
services:
  db:
    image: postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ulduar
  s3:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data
    network_mode: service:db
    environment:
      MINIO_ROOT_USER: ulduar
      MINIO_ROOT_PASSWORD: ulduar-test-only
  # One-shot: creates the archive's writer (no delete) and deleter users once MinIO answers. The script is the one
  # in dev_tools/services.py (tests/test_services.py checks it).
  s3-provision:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: "no"
    network_mode: service:db
    depends_on: [s3]
    entrypoint:
      - sh
      - -c
      - |
        set -e
        until mc alias set local http://127.0.0.1:9000 ulduar ulduar-test-only >/dev/null 2>&1; do sleep 1; done
        echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:ListBucket","s3:ListBucketMultipartUploads","s3:AbortMultipartUpload","s3:ListMultipartUploadParts","s3:GetBucketVersioning","s3:ListBucketVersions"],"Resource":["arn:aws:s3:::ulduar-test-*","arn:aws:s3:::ulduar-test-*/*"]}]}' > /tmp/ulduar-writer.json
        mc admin policy create local ulduar-writer /tmp/ulduar-writer.json
        mc admin user add local ulduar-writer ulduar-writer-test-only
        mc admin policy attach local ulduar-writer --user ulduar-writer
        echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:ListBucket","s3:ListBucketMultipartUploads","s3:AbortMultipartUpload","s3:ListMultipartUploadParts","s3:GetBucketVersioning","s3:ListBucketVersions","s3:DeleteObject","s3:DeleteObjectVersion","s3:GetObjectVersion"],"Resource":["arn:aws:s3:::ulduar-test-*","arn:aws:s3:::ulduar-test-*/*"]}]}' > /tmp/ulduar-deleter.json
        mc admin policy create local ulduar-deleter /tmp/ulduar-deleter.json
        mc admin user add local ulduar-deleter ulduar-deleter-test-only
        mc admin policy attach local ulduar-deleter --user ulduar-deleter
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    command: sleep infinity
    network_mode: service:db
    volumes:
      - ..:/workspace:cached
    environment:
      ULDUAR_TEST_DSN: postgresql://postgres:ulduar@127.0.0.1:5432/postgres
      ULDUAR_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      ULDUAR_TEST_S3_ACCESS_KEY: ulduar
      ULDUAR_TEST_S3_SECRET_KEY: ulduar-test-only
      ULDUAR_TEST_S3_WRITER_ACCESS_KEY: ulduar-writer
      ULDUAR_TEST_S3_WRITER_SECRET_KEY: ulduar-writer-test-only
      ULDUAR_TEST_S3_DELETER_ACCESS_KEY: ulduar-deleter
      ULDUAR_TEST_S3_DELETER_SECRET_KEY: ulduar-deleter-test-only
