# Project Ulduar — packaging, version and tool configuration.
# Install for development: pip install -e ".[dev]"   (runtime only: pip install -e .)
# The version here is the single product version; the package reads it at import.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ulduar"
version = "0.1.0.dev0"
description = "A vault and observatory for data projects: catalog and lineage, cold archive, run ledger, monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# Runtime dependencies are an ask-first decision (CLAUDE.md "Ask first"); each is signed off in ROADMAP.md.
# psycopg needs a system libpq 16 or newer; the `binary` extra brings a bundled one (Phase 1, F32).
dependencies = ["psycopg>=3.2,<4"]

[project.optional-dependencies]
binary = ["psycopg[binary]>=3.2,<4"]
# The S3 backend's client (Phase 2 sign-off H21).
s3 = ["boto3>=1.36,<2"]
# psycopg and boto3 are the test suite's clients for the local test services; boto3 also runs the
# S3 backend under test (the `s3` extra above).
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.34,<2",
    # Pinned exactly: the gating actionlint job installs this line; a new release's
    # rules must arrive as a Dependabot PR, not red CI on every PR.
    "actionlint-py==1.7.12.25",
    # Compiles requirements/dev.lock (the hashed lock of this extra).
    "pip-tools>=7.4",
    # Pinned exactly, like actionlint: ci-scan.yml installs it from the hashed lock.
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["ulduar", "ulduar.*"]

[tool.setuptools.package-data]
"ulduar" = ["py.typed"]
"ulduar.freya" = ["steps/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs the local PostgreSQL 18 test instance (tests/README.md); the pre-push hook skips them, verify and CI require them",
    "s3: needs the local object-store test instance (tests/README.md); the pre-push hook skips them, verify and CI require them",
]

[tool.mypy]
python_version = "3.11"
files = ["ulduar", "dev_tools", ".claude/hooks"]
strict = true

# boto3 and botocore ship no type information: the client is typed `Any` at the boundary (ulduar/hodir/_s3.py).
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# Ruff: pycodestyle, pyflakes, bugbear, import order and pyupgrade.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
